<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0b14; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(ellipse at 30% 20%, #2a1b5e 0%, #0b0b14 60%);
      }
      .orb { position: absolute; border-radius: 50%; filter: blur(80px); }
      #orb1 { width: 700px; height: 700px; left: -150px; top: 500px; background: #ff4d8d; opacity: 0.35; }
      #orb2 { width: 600px; height: 600px; right: -100px; top: -150px; background: #3de0ff; opacity: 0.30; }
      .line {
        position: absolute; left: 0; width: 100%; text-align: center;
        color: #f7f7fb; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap;
      }
      #l1 { top: 400px; font-size: 190px; }
      #l2 { top: 600px; font-size: 90px; font-weight: 500; color: #a9e9ff; }
      #bar { position: absolute; left: 760px; top: 560px; width: 400px; height: 6px; border-radius: 3px;
             background: linear-gradient(90deg, #ff4d8d, #3de0ff); transform-origin: left center; }
      #end { top: 470px; font-size: 130px; }
      .w { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="orb1" class="orb clip" data-layout-allow-overflow data-start="0" data-duration="8" data-track-index="0"></div>
      <div id="orb2" class="orb clip" data-layout-allow-overflow data-start="0" data-duration="8" data-track-index="1"></div>
      <div id="l1" class="line clip" data-start="0.3" data-duration="4.2" data-track-index="2">
        <span class="w">Bonjour&nbsp;!</span>
      </div>
      <div id="bar" class="clip" data-start="0.9" data-duration="3.6" data-track-index="3"></div>
      <div id="l2" class="line clip" data-start="1.2" data-duration="3.3" data-track-index="4">Test HyperFrames</div>
      <div id="end" class="line clip" data-start="4.8" data-duration="3.2" data-track-index="5">
        <span class="w">Ça</span> <span class="w">marche</span> <span class="w">✨</span>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#orb1", { x: 0, y: 0 }, { x: 300, y: -200, duration: 8, ease: "sine.inOut" }, 0);
      tl.fromTo("#orb2", { x: 0, y: 0 }, { x: -300, y: 250, duration: 8, ease: "sine.inOut" }, 0);

      // Scene 1
      tl.fromTo("#l1 .w", { opacity: 0, y: 120, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.6)" }, 0.3);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.9);
      tl.fromTo("#l2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.2);
      tl.to(["#l1", "#bar", "#l2"], { opacity: 0, y: -60, duration: 0.5, ease: "power2.in" }, 4.0);

      // Scene 2
      tl.fromTo("#end .w", { opacity: 0, y: 100, rotation: -6 },
        { opacity: 1, y: 0, rotation: 0, duration: 0.7, ease: "back.out(1.7)", stagger: 0.25 }, 4.8);
      tl.to("#end", { scale: 1.06, duration: 2.4, ease: "sine.inOut" }, 5.4);
      tl.to("#end", { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
